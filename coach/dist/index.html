<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141414"><meta name="description" content="Gyme トレーナー向けホーム。今日のセッション、会員の状況、チェックインをひと目で確認。"><title>Gyme | トレーナーホーム</title><link rel="stylesheet" href="shared.css?v=chat-badges-20260909"><link rel="stylesheet" href="style.css?v=chat-badges-20260909"></head><body>
<div class="device-wrap"><div class="device">
<header><div class="avatar coach"></div><div class="greeting"><h1 id="greeting">おはようございます、健太さん</h1><p>今日のジムの状況をチェック</p></div><button class="round" data-action="messages" aria-label="メッセージ"><i data-icon="message"></i><span class="badge" id="messages-badge" hidden></span></button><button class="round" data-action="notifications" aria-label="通知"><i data-icon="bell"></i><span class="badge" id="notifications-badge" hidden></span></button></header>
<main><section class="summary"><div class="summary-top"><h2>今日の Gyme</h2><span class="gym-mark"><i data-icon="dumbbell"></i></span></div><div class="contours"></div><div class="metrics" id="metrics"><button data-action="members"><span class="value">24 <i data-icon="users"></i></span><span>担当会員</span></button><button data-action="sessions"><span class="value">8 <i data-icon="calendar"></i></span><span>本日の<br>セッション</span></button><button data-action="checkins"><span class="value">6 <i data-icon="clock"></i></span><span>チェックイン<br>確認待ち</span></button><button data-action="notifications"><span class="value">3 <i data-icon="alert"></i></span><span>フォローが<br>必要な会員</span></button></div></section>
<section><div class="section-heading"><h2>今日のセッション</h2><button data-action="sessions">すべて見る <i data-icon="chevron"></i></button></div><div class="card sessions" id="sessions-list"><button class="session" data-member="0"><span class="avatar ken"></span><span class="time"><strong>10:00</strong><small>60分</small></span><span class="session-name"><strong>田中 健</strong><small>胸・上腕三頭筋</small></span><span class="count">18 / 24回</span><i data-icon="chevron"></i></button><button class="session" data-member="1"><span class="avatar yuki"></span><span class="time"><strong>11:30</strong><small>60分</small></span><span class="session-name"><strong>佐藤 由紀</strong><small>お尻・脚</small></span><span class="count">6 / 16回</span><i data-icon="chevron"></i></button><button class="session" data-member="2"><span class="avatar wang away"></span><span class="time"><strong>15:00</strong><small>60分</small></span><span class="session-name"><strong>王 明</strong><small>脂肪燃焼</small></span><span class="count">11 / 24回</span><i data-icon="chevron"></i></button></div></section>
<section><div class="section-heading"><h2>フォローが必要な会員</h2><button data-action="notifications">すべて見る <i data-icon="chevron"></i></button></div><div class="card alerts" id="alerts-list"><button data-alert="0"><span class="alert-icon red"><i data-icon="trend"></i></span><span><strong>ベンチプレスの記録が低下</strong><small>直近3回のセッションで記録が低下</small></span><i data-icon="chevron"></i></button><button data-alert="1"><span class="alert-icon amber"><i data-icon="note"></i></span><span><strong>食事の記録が未提出</strong><small>7日間、食事の投稿がありません</small></span><i data-icon="chevron"></i></button><button data-alert="2"><span class="alert-icon blue"><i data-icon="users"></i></span><span><strong>パーソナルトレーニング残り3回</strong><small>継続プランのご案内がおすすめです</small></span><i data-icon="chevron"></i></button></div></section>
<section class="quick"><div class="flourish"></div><div class="motto">もっと強く<br>もっと自分らしく<br>もっと輝く毎日へ</div><div class="section-heading"><h2>クイックアクション</h2></div><div class="actions"><button class="start" data-action="start"><i data-icon="play"></i><span>セッション<br>開始</span></button><button data-action="checkins"><i data-icon="check"></i><span>チェックイン<br>確認</span></button><button data-action="notes"><i data-icon="note"></i><span>会員<br>メモ</span></button><button data-action="renewals"><i data-icon="renew"></i><span>プラン更新</span></button></div></section></main>
<nav aria-label="メインナビゲーション"><button class="active" data-action="home"><i data-icon="home"></i><span>ホーム</span></button><button data-action="members"><i data-icon="users"></i><span>会員</span></button><button data-action="sessions"><i data-icon="calendar"></i><span>セッション</span></button><button data-action="messages"><i data-icon="message"></i><span>メッセージ</span></button><button data-action="profile"><i data-icon="user"></i><span>プロフィール</span></button></nav>
<dialog id="panel"><div class="dialog-head"><h2 id="panel-title"></h2><button id="close" aria-label="閉じる">×</button></div><div id="panel-body"></div></dialog><div id="toast" role="status"></div></div></div>
<dialog id="chat">
  <div class="chat-head">
    <button id="chat-back" class="chat-back" aria-label="会員一覧に戻る" hidden><i data-icon="chevronLeft"></i></button>
    <span class="chat-avatar" id="chat-avatar" hidden></span>
    <div class="chat-head-text"><strong id="chat-title"></strong><small id="chat-subtitle" hidden></small></div>
    <button id="chat-close" class="chat-close" aria-label="閉じる">×</button>
  </div>
  <div class="chat-list" id="chat-list" hidden></div>
  <div class="chat-thread" id="chat-thread" hidden>
    <div class="chat-messages" id="chat-messages"></div>
    <form class="chat-input" id="chat-form">
      <textarea id="chat-text" rows="1" placeholder="メッセージを入力" maxlength="2000"></textarea>
      <button type="submit" class="chat-send" id="chat-send" aria-label="送信"><i data-icon="send"></i></button>
    </form>
  </div>
</dialog>
<script src="shared.js?v=chat-badges-20260909"></script><script src="app.js?v=chat-badges-20260909"></script></body></html>
